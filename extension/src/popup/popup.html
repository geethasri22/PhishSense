<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishSense</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="brand-title">PhishSense</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>ACTIVE</span>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:600;">Protection Overview</span>
      <span style="font-size:11px; color:var(--text-secondary);">Gmail Engine</span>
    </div>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Scanned</div>
        <div class="stat-value" id="stat-scanned">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Threats</div>
        <div class="stat-value" style="color:var(--phishing-red);" id="stat-threats">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Phishing</div>
        <div class="stat-value" style="color:var(--phishing-red);" id="stat-phishing">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Suspicious</div>
        <div class="stat-value" style="color:var(--suspicious-yellow);" id="stat-suspicious">0</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-open-dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      Open Dashboard
    </button>
    <button class="btn btn-secondary" id="btn-open-settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings & Privacy
    </button>
  </div>

  <div class="footer">
    PhishSense v1.0.0 — Think Before You Click.
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
